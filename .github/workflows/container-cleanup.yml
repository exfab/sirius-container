name: Container Retention Policy

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Compute cut-off date
        id: cutoff
        run: echo "date=$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Delete untagged images older than 2 weeks
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: stajichlab
          image-names: aaftf
          tag-selection: untagged
          cut-off: ${{ steps.cutoff.outputs.date }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only latest beta/alpha release tag
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: stajichlab
          image-names: aaftf
          image-tags: "*alpha* *beta* *b[0-9]*"
          tag-selection: tagged
          keep-n-most-recent: 1
          token: ${{ secrets.GITHUB_TOKEN }}
