# Builds and publishes the SIRIUS container image.
#
# - Every push to main:      rebuilds the Docker image and publishes it as
#                             ghcr.io/exfab/sirius-container/sirius:latest / :main
# - Every version tag (v*):  builds the Docker image pinned to that version and
#                             publishes ghcr.io/exfab/sirius-container/sirius:<version>
#                             / <version>-<arch> / :latest
#
# All images are signed with Cosign (Sigstore) using GitHub's OIDC identity
# (no GPG keys or secrets required) and get SLSA provenance attestations for
# supply-chain security.

name: Build container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sirius_version:
        description: "SIRIUS version to build (e.g. 6.3.12). Defaults to the value in the VERSION file."
        required: false
        default: ""
      sirius_arch:
        description: "SIRIUS architecture suffix (e.g. linux-x64)"
        required: false
        default: "linux-x64"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sirius

jobs:
  docker-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version/arch
        id: params
        run: |
          DEFAULT_VERSION="$(tr -d '[:space:]' < VERSION)"
          DEFAULT_ARCH="linux-x64"
          SIRIUS_VERSION="${{ github.event.inputs.sirius_version }}"
          SIRIUS_VERSION="${SIRIUS_VERSION:-${DEFAULT_VERSION}}"
          SIRIUS_ARCH="${{ github.event.inputs.sirius_arch }}"
          SIRIUS_ARCH="${SIRIUS_ARCH:-${DEFAULT_ARCH}}"
          echo "version=${SIRIUS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch=${SIRIUS_ARCH}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          build-args: |
            SIRIUS_VERSION=${{ steps.params.outputs.version }}
            SIRIUS_ARCH=${{ steps.params.outputs.arch }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version/arch from tag
        id: params
        run: |
          DEFAULT_ARCH="linux-x64"
          TAG_BODY="${GITHUB_REF_NAME#v}"
          # Pattern: v<major>.<minor>.<patch>[-<arch>] e.g. v6.3.12 or v6.3.12-linux-x64
          if [[ "${TAG_BODY}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            SIRIUS_VERSION="${BASH_REMATCH[1]}"
            SIRIUS_ARCH="${BASH_REMATCH[2]}"
          else
            SIRIUS_VERSION="${TAG_BODY}"
            SIRIUS_ARCH="${DEFAULT_ARCH}"
          fi
          echo "version=${SIRIUS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch=${SIRIUS_ARCH}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          build-args: |
            SIRIUS_VERSION=${{ steps.params.outputs.version }}
            SIRIUS_ARCH=${{ steps.params.outputs.arch }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}-${{ steps.params.outputs.arch }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-sign:
    needs: [docker-main, docker-release]
    runs-on: ubuntu-latest
    if: always() && (contains(needs.docker-main.result, 'success') || contains(needs.docker-release.result, 'success'))
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign main/latest images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cosign sign --yes --recursive \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}@${{ needs.docker-main.outputs.digest }}"

      - name: Sign release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign sign --yes --recursive \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}@${{ needs.docker-release.outputs.digest }}"

  provenance:
    needs: [docker-main, docker-release, docker-sign]
    runs-on: ubuntu-latest
    if: always() && (contains(needs.docker-main.result, 'success') || contains(needs.docker-release.result, 'success'))
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA provenance predicate
        id: slsa-predicate
        run: |
          started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          predicate_file="${RUNNER_TEMP}/slsa-provenance.json"
          cat > "${predicate_file}" <<JSON
          {
            "buildDefinition": {
              "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml",
              "externalParameters": {},
              "internalParameters": {},
              "resolvedDependencies": []
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              },
              "metadata": {
                "invocationId": "${GITHUB_RUN_ID}",
                "startedOn": "${started_on}"
              },
              "byproducts": []
            }
          }
          JSON
          echo "path=${predicate_file}" >> "${GITHUB_OUTPUT}"

      - name: Attest main/latest images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cosign attest --yes \
            --predicate "${{ steps.slsa-predicate.outputs.path }}" \
            --type=slsaprovenance1 \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}@${{ needs.docker-main.outputs.digest }}"

      - name: Attest release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign attest --yes \
            --predicate "${{ steps.slsa-predicate.outputs.path }}" \
            --type=slsaprovenance1 \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}@${{ needs.docker-release.outputs.digest }}"
