name: Build Apptainer image

on:
  push:
    branches: ["main"]
    # Tags follow the pattern v<version> or v<version>-<arch>, e.g. v6.3.12 or v6.3.12-linux-x64
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      sirius_version:
        description: "SIRIUS version to build (e.g. 6.3.12). Defaults to the value in the VERSION file."
        required: false
        default: ""
      sirius_arch:
        description: "SIRIUS architecture suffix (e.g. linux-x64)"
        required: false
        default: "linux-x64"

jobs:
  build:
    name: Build sirius.sif
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve SIRIUS_VERSION and SIRIUS_ARCH from (in priority order):
      #   1. Tag name  (v<version>  or  v<version>-<arch>)
      #   2. workflow_dispatch inputs
      #   3. VERSION file (version) / hardcoded default (arch)
      - name: Resolve build parameters
        id: params
        run: |
          DEFAULT_VERSION="$(cat VERSION | tr -d '[:space:]')"
          DEFAULT_ARCH="linux-x64"

          TAG="${GITHUB_REF_NAME:-}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Strip leading 'v'
            TAG_BODY="${TAG#v}"
            # If tag contains a '-arch' suffix after the semver part, split it
            # Pattern: v<major>.<minor>.<patch>-<arch>  e.g. v6.3.12-linux-x64
            if [[ "${TAG_BODY}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
              SIRIUS_VERSION="${BASH_REMATCH[1]}"
              SIRIUS_ARCH="${BASH_REMATCH[2]}"
            else
              SIRIUS_VERSION="${TAG_BODY}"
              SIRIUS_ARCH="${DEFAULT_ARCH}"
            fi
          else
            SIRIUS_VERSION="${{ github.event.inputs.sirius_version }}"
            SIRIUS_VERSION="${SIRIUS_VERSION:-${DEFAULT_VERSION}}"
            SIRIUS_ARCH="${{ github.event.inputs.sirius_arch }}"
            SIRIUS_ARCH="${SIRIUS_ARCH:-${DEFAULT_ARCH}}"
          fi

          echo "SIRIUS_VERSION=${SIRIUS_VERSION}" >> "$GITHUB_ENV"
          echo "SIRIUS_ARCH=${SIRIUS_ARCH}"       >> "$GITHUB_ENV"
          echo "version=${SIRIUS_VERSION}"        >> "$GITHUB_OUTPUT"
          echo "arch=${SIRIUS_ARCH}"              >> "$GITHUB_OUTPUT"

      - name: Install Apptainer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            build-essential \
            libseccomp-dev \
            libglib2.0-dev \
            pkg-config \
            squashfs-tools \
            cryptsetup \
            runc \
            wget
          # Install apptainer from the official deb repository
          wget -qO /tmp/apptainer.deb \
            "https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb"
          sudo dpkg -i /tmp/apptainer.deb

      - name: Build Apptainer image
        run: |
          sudo apptainer build \
            --build-arg SIRIUS_VERSION="${SIRIUS_VERSION}" \
            --build-arg SIRIUS_ARCH="${SIRIUS_ARCH}" \
            sirius-${SIRIUS_VERSION}-${SIRIUS_ARCH}.sif \
            sirius.def

      # ── Integrity & signing ──────────────────────────────────────────────

      - name: Compute SHA256 checksum
        run: |
          sha256sum sirius-${SIRIUS_VERSION}-${SIRIUS_ARCH}.sif \
            > sirius-${SIRIUS_VERSION}-${SIRIUS_ARCH}.sif.sha256
          cat sirius-${SIRIUS_VERSION}-${SIRIUS_ARCH}.sif.sha256

      # Requires repository secrets: GPG_PRIVATE_KEY (armored) and GPG_PASSPHRASE.
      # When the secrets are absent the step is skipped gracefully.
      - name: Import GPG key
        id: gpg_import
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          # Retrieve the fingerprint of the just-imported key
          FINGERPRINT=$(gpg --with-colons --import-status /dev/null 2>&1 || \
            gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"

      - name: Create detached GPG signature (.asc)
        if: steps.gpg_import.conclusion == 'success'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PASSPHRASE}" | gpg --batch --yes --passphrase-fd 0 \
            --detach-sign --armor \
            sirius-${SIRIUS_VERSION}-${SIRIUS_ARCH}.sif

      - name: Embed signature via apptainer sign
        if: steps.gpg_import.conclusion == 'success'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Import the key into Apptainer's local keyring so it can sign
          gpg --export --armor | sudo apptainer key import /dev/stdin
          echo "${GPG_PASSPHRASE}" | sudo apptainer sign \
            --keyidx 0 \
            sirius-${SIRIUS_VERSION}-${SIRIUS_ARCH}.sif

      # ── Upload artifacts ─────────────────────────────────────────────────

      - name: Upload image and checksums as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}
          path: |
            sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}.sif
            sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}.sif.sha256
            sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}.sif.asc
          retention-days: 30

      # Attach all available assets to the GitHub Release when a tag is pushed
      - name: Upload assets to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}.sif
            sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}.sif.sha256
            sirius-${{ env.SIRIUS_VERSION }}-${{ env.SIRIUS_ARCH }}.sif.asc

